name: Build Self-Contained .NET Console for Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x  # coloque a versão que você usa

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish self-contained EXE
      run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -o build

    - name: Upload EXE
      uses: actions/upload-artifact@v3
      with:
        name: app-windows-selfcontained
        path: build/
